version: '3.3'

# ─────────────────────────────────────────────────────────────────────────────
# STAGING-ONLY STACK (branch: dhruv-from-palak)
#
# Only the services the staging/sandbox soak actually needs. The production
# stack (mysql_db_api, redis_cache, kafka, api, report-worker) has been removed
# from this file — it is deployed from the production branch's compose file.
#
# Everything here sits on career_staging_net so the sandbox profile's hostnames
# resolve: application.yml (on-profile: sandbox) points at mysql_db_staging,
# redis_staging and kafka-staging by service name, and GOTENBERG_URL points at
# gotenberg. All five must therefore share one network.
#
# NOTE: `docker compose up -d` with this file will report any still-running
# production containers as orphans. Do NOT pass --remove-orphans on a host that
# also runs prod from a different compose project.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── MySQL (staging) ────────────────────────────────────────────────────────
  mysql_db_staging:
    image: mysql:latest
    restart: always
    environment:
      MYSQL_DATABASE: 'career-9-staging'
      MYSQL_USER: 'user'
      MYSQL_PASSWORD: 'Career-qCsfeuECc3MW'
      MYSQL_ROOT_PASSWORD: 'Career-qCsfeuECc3MW'
    ports:
      - '3307:3306'
    volumes:
      - mysql_staging_data:/var/lib/mysql
      - ./mysql-custom.cnf:/etc/mysql/conf.d/custom.cnf
    deploy:
      resources:
        limits:
          memory: 1.5g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pCareer-qCsfeuECc3MW"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - career_staging_net

  # ── Redis (staging) ────────────────────────────────────────────────────────
  redis_staging:
    image: redis:7.2-alpine
    restart: always
    command: >
      redis-server
      --maxmemory 384mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    # SECURITY: loopback only — never publish redis to 0.0.0.0. Docker rewrites
    # raw iptables and bypasses ufw, so a 0.0.0.0 binding with no requirepass is
    # reachable from the internet (that is how the prod cache was hijacked via
    # REPLICAOF on 2026-06-25). api-staging reaches this over the Docker network
    # by service name, so the host mapping is for local admin tooling only.
    ports:
      - '127.0.0.1:6380:6379'
    deploy:
      resources:
        limits:
          memory: 768m
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - career_staging_net

  # ── Kafka (KRaft, single broker) — staging report-on-completion queue ───────
  #    api-staging produces here; report-worker-staging consumes.
  kafka-staging:
    image: apache/kafka:latest
    container_name: kafka-staging
    restart: unless-stopped
    expose:
      - "9092"
    # apache/kafka official image → KAFKA_* env (NOT bitnami's KAFKA_CFG_*).
    # Single-node KRaft (broker + controller in one process), advertised by service name.
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-staging:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-staging:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
    volumes:
      - kafka_staging_data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    networks:
      - career_staging_net

  # ── Headless-Chromium HTML→PDF renderer for server-rendered report PDFs ────
  # Stateless. Both api-staging and report-worker-staging reach it by service
  # name at GOTENBERG_URL=http://gotenberg:3000. No host port is published, so
  # the render endpoint is never exposed outside the Docker network.
  #
  # This instance is attached to career_staging_net (the production compose file
  # runs its own instance on career_shared_net). If you ever want ONE shared
  # renderer again, attach it to both networks instead of duplicating it.
  #
  # PDFs render synchronously during report generation; concurrent load is just
  # however many generate requests run at once. Bump memory for large cohorts.
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=false"   # reports draw charts client-side
      - "--api-timeout=120s"
    expose:
      - "3000"          # internal-only; reachable as http://gotenberg:3000
    deploy:
      resources:
        limits:
          memory: 1.5g
          cpus: "3.0"          # cap Chromium renders so they can't starve the API
    networks:
      - career_staging_net

  # ── Staging API ────────────────────────────────────────────────────────────
  api-staging:
    container_name: api-staging
    build:
      context: ./spring-social
      dockerfile: dockerfile
    ports:
      - 8081:8080
    command: ["java", "-Xms1g", "-Xmx2g", "-jar", "/usr/local/lib/demo.jar", "--spring.profiles.active=sandbox"]
    restart: always
    volumes:
      - ./spring-social/src/main/resources/firebase-service-account.json:/config/firebase-service-account.json:ro
    env_file:
      - .env.staging
    environment:
      - APP_FIREBASE_SERVICE_ACCOUNT_FILE=/config/firebase-service-account.json
      # HTML→PDF render service, reached by compose service name on the Docker network.
      # Without this the backend falls back to the application.yml default localhost:3000
      # (nothing listens there inside the container) and every PDF render fails.
      - GOTENBERG_URL=http://gotenberg:3000
      # Staging Kafka broker (KRaft) — the report-on-completion pipeline queue that
      # report-worker-staging consumes from. Without it the report pipeline can't enqueue.
      - KAFKA_BOOTSTRAP=kafka-staging:9092
    deploy:
      resources:
        limits:
          memory: 3g
    depends_on:
      mysql_db_staging:
        condition: service_healthy
      redis_staging:
        condition: service_healthy
      kafka-staging:
        condition: service_started
    networks:
      - career_staging_net

  # ── Report worker (staging) — runs the Kafka consumers (report generate +
  #    email) in their own JVM on the sandbox profile, isolated from the staging
  #    API. Same image, profile sandbox,report-worker, no HTTP server. Shares the
  #    staging DB + Redis (via .env.staging), kafka-staging and gotenberg. ──
  report-worker-staging:
    container_name: report-worker-staging
    build:
      context: ./spring-social
      dockerfile: dockerfile
    command: ["java", "-Xms512m", "-Xmx1g", "-jar", "/usr/local/lib/demo.jar", "--spring.profiles.active=sandbox,report-worker"]
    restart: always
    env_file:
      - .env.staging
    environment:
      # Worker only consumes Kafka → generates reports → emails. Firebase Admin SDK
      # (FCM/push) is unused here, so disable it and skip mounting the secret; report
      # emails still send via the classpath Gmail service account baked into the jar.
      - APP_FIREBASE_ENABLED=false
      - GOTENBERG_URL=http://gotenberg:3000
      # Same Kafka the staging API (api-staging) produces to, so the worker consumes
      # the report.generate / report.email events it emits.
      - KAFKA_BOOTSTRAP=kafka-staging:9092
    deploy:
      resources:
        limits:
          memory: 1.5g
          cpus: "3.0"          # the worker's render budget
    depends_on:
      mysql_db_staging:
        condition: service_healthy
      redis_staging:
        condition: service_healthy
      kafka-staging:
        condition: service_started
    networks:
      - career_staging_net

volumes:
  mysql_staging_data:
  redis_staging_data:
  kafka_staging_data:

networks:
  career_staging_net:
    external: true
