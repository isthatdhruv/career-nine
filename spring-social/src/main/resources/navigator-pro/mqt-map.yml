# Unscored rows. Work Values: the single ranking question; each option carries a
# value tag as its MQT (Curiosity … Influence), and the rank order is what counts.
# Aspiration: the multi-select pick (2–3 domains) whose options score under this
# MQT; it never enters scoring and feeds the Explorer branch only.
values:
  options: 12
  ranked: 4
aspiration:
  mqt: "Aspiration"
