# Navigator Pro construct map — v3 (Sept 2026 instrument, questionnaire "Navigator Pro").
# Which measured-quality-type (MQT) names feed each construct, how many questions
# each construct must have in the questionnaire, and the score range every stored
# option score must lie in. Source: Assessment_questionnaire_SEQUENCED.xlsx (MQT tags)
# and NavigatorPro_Report_Logic_v3.xlsx (sheet 1 Scoring, sheet 5 display maps).
# Reversal lives in the stored scores (reverse-keyed items and the attended-class
# validity item are pre-inverted); the engine only sums. Renaming an MQT in the
# admin = editing this file. Labels are the student-facing display names.
#
# Internal keys keep the engine's names (f_id Internal Drive, f_st Sustained Tenacity,
# f_ae Adaptive Execution); the labels are the v3 display map.
constructs:
  f_id:      { label: "Self-Motivation", mqts: ["Self-Efficacy", "Growth Mindset"],                    questions: 4, min: 1, max: 5 }
  f_st:      { label: "Consistency",     mqts: ["Perseverance"],                                       questions: 3, min: 1, max: 5 }
  f_ae:      { label: "Adaptability",    mqts: ["Proactivity", "Learning Agility", "Metacognition"],  questions: 4, min: 1, max: 5 }
  validity:  { label: "Validity",        mqts: ["Validity"],        questions: 3, min: 1, max: 5 }
  attention: { label: "Attention check", mqts: ["Attention Check"], questions: 1, min: 0, max: 1 }
  fam_r:     { label: "Hands-on",       mqts: ["Hands-on"],       questions: 6, min: 0, max: 1 }
  fam_i:     { label: "Analytical",     mqts: ["Analytical"],     questions: 6, min: 0, max: 1 }
