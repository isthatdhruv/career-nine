  <text class="tt" x="648" y="296">counselling_slot</text>
  <text class="cc" x="648" y="316"><tspan class="kk">PK</tspan> id</text>
  <text class="cc" x="648" y="332"><tspan class="kf">FK</tspan> counsellor_id</text>
  <text class="cc" x="648" y="348"><tspan class="kf">FK</tspan> template_id</text>
  <text class="cc" x="648" y="364">date</text>
  <text class="cc" x="648" y="380">start_time</text>
  <text class="cc" x="648" y="396">status</text>
  <text class="cc" x="648" y="412">held_until</text>
</g>
<g>
  <rect class="bd" x="640" y="460" width="240" height="94" rx="3"/>
  <rect class="hd" x="640" y="460" width="240" height="24" rx="3"/>
  <text class="tt" x="648" y="476">counselling_request</text>
  <text class="cc" x="648" y="496"><tspan class="kk">PK</tspan> id</text>
  <text class="cc" x="648" y="512"><tspan class="ks">~</tspan> user_student_id <tspan class="ex">↗</tspan></text>
  <text class="cc" x="648" y="528"><tspan class="ks">~</tspan> assessment_id <tspan class="ex">↗</tspan></text>
  <text class="cc" x="648" y="544">status</text>
</g>

<!-- ══ column D · the meeting ══ -->
<g class="core">
  <rect class="bd" x="940" y="230" width="250" height="158" rx="3"/>
  <rect class="hd" x="940" y="230" width="250" height="24" rx="3"/>
