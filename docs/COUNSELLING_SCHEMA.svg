  <text class="cc" x="948" y="314"><tspan class="kf">FK</tspan> counsellor_id</text>
  <text class="cc" x="948" y="330"><tspan class="kf">FK</tspan> assigned_by <tspan class="ex">↗</tspan></text>
  <text class="cc" x="948" y="346"><tspan class="ks">~</tspan> entitlement_id <tspan class="ex">↗</tspan></text>
  <text class="cc" x="948" y="362">status</text>
  <text class="cc" x="948" y="378">mode</text>
</g>

