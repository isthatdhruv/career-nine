<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 710" width="1480" height="710"
     role="img" aria-label="Entity relationship diagram of the Career-9 counselling schema">
<title>Career-9 · Counselling schema</title>
<style>
  svg {
    --ground:#F3F6F4; --surface:#FFFFFF; --surface-2:#EAEFEC;
    --ink:#131A17; --muted:#5B6B64; --faint:#8A9A92; --line:#C6D2CB;
    --accent:#2C7A57; --accent-soft:#E2F0E8; --link:#2A5FA8; --warn:#9A6B18;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --ground:#101614; --surface:#18211E; --surface-2:#1F2A26;
      --ink:#E4EDE8; --muted:#9AAAA2; --faint:#6E7F77; --line:#33423B;
      --accent:#62BF92; --accent-soft:#1B2E26; --link:#7FAEE8; --warn:#D5A752;
    }
  }
  .bg { fill:var(--ground); }
  .bd { fill:var(--surface); stroke:var(--line); stroke-width:1; }
  .hd { fill:var(--surface-2); stroke:var(--line); stroke-width:1; }
  .core .bd { stroke:var(--accent); stroke-width:1.5; }
  .core .hd { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.5; }
  .tt { font:700 11.5px ui-monospace,'Cascadia Mono','SF Mono',Menlo,Consolas,monospace; fill:var(--ink); }
  .core .tt { fill:var(--accent); }
  .cc { font:10.5px ui-monospace,'Cascadia Mono','SF Mono',Menlo,Consolas,monospace; fill:var(--muted); }
  .kk { font-weight:700; fill:var(--accent); }
  .kf { font-weight:700; fill:var(--link); }
  .ks { font-weight:700; fill:var(--warn); }
  .ex { fill:var(--faint); }
  .ln { fill:none; stroke:var(--line); stroke-width:1.4; }
  .mk { fill:none; stroke:var(--line); stroke-width:1.3; }
  .lg  { font:700 15px ui-monospace,'Cascadia Mono','SF Mono',Menlo,Consolas,monospace; fill:var(--ink); }
  .lgs { font:11px system-ui,'Segoe UI',sans-serif; fill:var(--muted); }
  .lgk { font:10.5px ui-monospace,'Cascadia Mono','SF Mono',Menlo,Consolas,monospace; fill:var(--faint); }
</style>
<defs>
  <marker id="many" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path class="mk" d="M11,6 L1,1 M11,6 L1,11 M11,6 L1,6"/>
  </marker>
  <marker id="one" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path class="mk" d="M6,1 L6,11 M6,6 L11,6"/>
  </marker>
</defs>

<rect class="bg" x="0" y="0" width="1480" height="710"/>

<!-- ══ relationships (drawn first, boxes sit on top) ══ -->
<!-- counsellors → scoping + availability -->
<path class="ln" d="M260,242 H290 V68 H320"  marker-end="url(#many)"/>
<path class="ln" d="M260,242 H290 V178 H320" marker-end="url(#many)"/>
<path class="ln" d="M260,242 H290 V288 H320" marker-end="url(#many)"/>
<path class="ln" d="M260,242 H290 V418 H320" marker-end="url(#many)"/>
<!-- counsellors → slot (threads the gap between the col-2 boxes) -->
<path class="ln" d="M260,242 H280 V352 H620 V328 H640" marker-end="url(#many)"/>
<!-- counsellors → appointment (routed under the diagram) -->
<path class="ln" d="M260,242 H272 V635 H920 V310 H940" marker-end="url(#many)"/>
<!-- counsellors → rating (routed over the diagram) -->
<path class="ln" d="M140,210 V8 H1235 V169 H1250" marker-end="url(#many)"/>
<!-- counsellors → activity log, block dates -->
<path class="ln" d="M140,320 V360" marker-end="url(#many)"/>
<path class="ln" d="M20,242 H6 V528 H20" marker-end="url(#many)"/>
<!-- template → slot -->
<path class="ln" d="M580,402 H610 V344 H640" marker-end="url(#many)"/>
<!-- slot → appointment (one-to-one) -->
<path class="ln" d="M880,312 H910 V278 H940" marker-end="url(#one)"/>
<!-- appointment → its satellites -->
<path class="ln" d="M1190,262 H1220 V68 H1250"  marker-end="url(#one)"/>
<path class="ln" d="M1190,262 H1220 V153 H1250" marker-end="url(#one)"/>
<path class="ln" d="M1190,262 H1220 V278 H1250" marker-end="url(#one)"/>
<path class="ln" d="M1190,262 H1220 V383 H1250" marker-end="url(#many)"/>
<path class="ln" d="M1190,262 H1220 V488 H1250" marker-end="url(#many)"/>

<text class="lgk" x="616" y="348">generates</text>
<text class="lgk" x="884" y="306">1:1</text>
<text class="lgk" x="290" y="631">counsellor_id</text>

<!-- ══ legend, in the empty upper-right ══ -->
<g>
  <text class="lg"  x="940" y="46">Career-9 · counselling schema</text>
  <text class="lgs" x="940" y="68">19 tables · 16 internal foreign keys · 11 more point outside the module</text>
  <text class="lgk" x="940" y="98"><tspan class="kk">PK</tspan>  primary key     <tspan class="kf">FK</tspan>  foreign key     <tspan class="ks">UQ</tspan>  unique</text>
  <text class="lgk" x="940" y="118"><tspan class="ks">~</tspan>   id held without a database constraint</text>
  <text class="lgk" x="940" y="138"><tspan class="ex">↗</tspan>   target lives outside counselling</text>
  <text class="lgk" x="940" y="158">⌐  crow's foot = many        ⊢ bar = one-to-one</text>
  <text class="lgs" x="940" y="186">Read left to right: a counsellor writes availability rules,</text>
  <text class="lgs" x="940" y="202">the rules generate slots, a slot becomes one appointment.</text>
</g>

<!-- ══ column A · the counsellor ══ -->
<g class="core">
  <rect class="bd" x="20" y="210" width="240" height="110" rx="3"/>
  <rect class="hd" x="20" y="210" width="240" height="24" rx="3"/>
  <text class="tt" x="28" y="226">counsellors</text>
  <text class="cc" x="28" y="246"><tspan class="kk">PK</tspan> id</text>
  <text class="cc" x="28" y="262"><tspan class="kf">FK</tspan> user_id <tspan class="ex">↗</tspan></text>
  <text class="cc" x="28" y="278">name</text>
  <text class="cc" x="28" y="294">onboarding_status</text>
  <text class="cc" x="28" y="310">is_active</text>
</g>
<g>
  <rect class="bd" x="20" y="360" width="240" height="78" rx="3"/>
  <rect class="hd" x="20" y="360" width="240" height="24" rx="3"/>
  <text class="tt" x="28" y="376">counselling_activity_log</text>
  <text class="cc" x="28" y="396"><tspan class="kk">PK</tspan> id</text>
  <text class="cc" x="28" y="412"><tspan class="kf">FK</tspan> counsellor_id</text>
  <text class="cc" x="28" y="428">activity_type</text>
</g>
<g>
  <rect class="bd" x="20" y="480" width="240" height="94" rx="3"/>
  <rect class="hd" x="20" y="480" width="240" height="24" rx="3"/>
  <text class="tt" x="28" y="496">block_date_request</text>
  <text class="cc" x="28" y="516"><tspan class="kk">PK</tspan> id</text>
  <text class="cc" x="28" y="532"><tspan class="kf">FK</tspan> counsellor_id</text>
  <text class="cc" x="28" y="548">block_date</text>
  <text class="cc" x="28" y="564">status</text>
</g>
<g>
  <rect class="bd" x="20" y="600" width="240" height="78" rx="3"/>
  <rect class="hd" x="20" y="600" width="240" height="24" rx="3"/>
  <text class="tt" x="28" y="616">counselling_notification</text>
  <text class="cc" x="28" y="636"><tspan class="kk">PK</tspan> id</text>
  <text class="cc" x="28" y="652"><tspan class="kf">FK</tspan> user_id <tspan class="ex">↗</tspan></text>
  <text class="cc" x="28" y="668">reference_type</text>
</g>

<!-- ══ column B · scoping and availability rules ══ -->
<g>
  <rect class="bd" x="320" y="20" width="260" height="78" rx="3"/>
  <rect class="hd" x="320" y="20" width="260" height="24" rx="3"/>
  <text class="tt" x="328" y="36">counsellor_institute_mapping</text>
  <text class="cc" x="328" y="56"><tspan class="kk">PK</tspan> id</text>
  <text class="cc" x="328" y="72"><tspan class="kf">FK</tspan> counsellor_id</text>
  <text class="cc" x="328" y="88"><tspan class="kf">FK</tspan> institute_code <tspan class="ex">↗</tspan></text>
</g>
<g>
  <rect class="bd" x="320" y="130" width="260" height="78" rx="3"/>
  <rect class="hd" x="320" y="130" width="260" height="24" rx="3"/>
  <text class="tt" x="328" y="146">counsellor_assessment_assignment</text>
  <text class="cc" x="328" y="166"><tspan class="kk">PK</tspan> id</text>
  <text class="cc" x="328" y="182"><tspan class="kf">FK</tspan> counsellor_id</text>
  <text class="cc" x="328" y="198"><tspan class="ks">~</tspan> assessment_id <tspan class="ex">↗</tspan></text>
</g>
<g>
  <rect class="bd" x="320" y="240" width="260" height="94" rx="3"/>
  <rect class="hd" x="320" y="240" width="260" height="24" rx="3"/>
  <text class="tt" x="328" y="256">student_counsellor_mapping</text>
  <text class="cc" x="328" y="276"><tspan class="kk">PK</tspan> id</text>
  <text class="cc" x="328" y="292"><tspan class="kf">FK</tspan> counsellor_id</text>
  <text class="cc" x="328" y="308"><tspan class="kf">FK</tspan> student_id <tspan class="ex">↗</tspan></text>
  <text class="cc" x="328" y="324"><tspan class="kf">FK</tspan> assigned_by <tspan class="ex">↗</tspan></text>
</g>
<g>
  <rect class="bd" x="320" y="370" width="260" height="110" rx="3"/>
  <rect class="hd" x="320" y="370" width="260" height="24" rx="3"/>
  <text class="tt" x="328" y="386">availability_template</text>
  <text class="cc" x="328" y="406"><tspan class="kk">PK</tspan> id</text>
  <text class="cc" x="328" y="422"><tspan class="kf">FK</tspan> counsellor_id</text>
  <text class="cc" x="328" y="438">day_of_week</text>
  <text class="cc" x="328" y="454">start_time</text>
  <text class="cc" x="328" y="470">end_time</text>
</g>
<g>
  <rect class="bd" x="320" y="515" width="260" height="78" rx="3"/>
  <rect class="hd" x="320" y="515" width="260" height="24" rx="3"/>
  <text class="tt" x="328" y="531">slot_configuration</text>
  <text class="cc" x="328" y="551"><tspan class="kk">PK</tspan> id</text>
  <text class="cc" x="328" y="567">name</text>
  <text class="cc" x="328" y="583">slot_duration</text>
</g>

<!-- ══ column C · the calendar, plus who paid ══ -->
<g>
  <rect class="bd" x="640" y="20" width="240" height="94" rx="3"/>
  <rect class="hd" x="640" y="20" width="240" height="24" rx="3"/>
  <text class="tt" x="648" y="36">counselling_plan</text>
  <text class="cc" x="648" y="56"><tspan class="kk">PK</tspan> id</text>
  <text class="cc" x="648" y="72"><tspan class="kf">FK</tspan> institute_code <tspan class="ex">↗</tspan></text>
  <text class="cc" x="648" y="88">total_sessions</text>
  <text class="cc" x="648" y="104">sessions_used</text>
</g>
<g>
  <rect class="bd" x="640" y="145" width="240" height="94" rx="3"/>
  <rect class="hd" x="640" y="145" width="240" height="24" rx="3"/>
